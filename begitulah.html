input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a)}

button.opt:hover{background:#1f1f1f}.sel{border-color:var(--a)!important;background:#172554}
.ok{border-color:#22c55e!important;background:#0f2a1b}.bad{border-color:#ef4444!important;background:#2d1215}

.nb.a{background:var(--a);color:#fff}.nb.f{background:#eab308;color:#000}.nb.cur{outline:2px solid #fff}
label.k{display:block;font-size:12px;color:#a3a3a3;margin:12px 0 4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px}.heat i{display:block;border-radius:3px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.view{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

const MATERI=[];let _k,_m;RAW.split('\n').forEach(l=>{if(l[0]=='#'){[_k,_m]=l.slice(1).split('|');_k=+_k}else{const i=l.indexOf('|'),b=l.slice(0,i).trim();MATERI.push({k:_k,m:_m,b,r:l.slice(i+1).trim(),id:_k+'|'+b})}});

/* ===== Database (IndexedDB via localForage) ===== */
const mk=n=>localforage.createInstance({name:'stpn',storeName:n});
const DB={prog:mk('progressMateri'),q:mk('customQuestions'),to:mk('tryoutHistory'),ses:mk('studySessions'),notes:mk('notes'),app:mk('appState')};
const $=s=>document.querySelector(s);
let P={},CQ=[],HIST=[],SESS=[],NOTES={},view='dash',bankTab='list',editId=null,IMG=null,BF={m:'',k:'',b:''},TO=null,RES=null,AC=null;
const T={dur:3600,left:3600,run:false,end:0,started:false,sel:'',sig:null};
let sy;
function stat(t){const e=$('#sy');if(e)e.textContent=t}
function sync(manual){clearTimeout(sy);sy=setTimeout(async()=>{try{const r=await fetch('http://localhost:3000/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap()),signal:AbortSignal.timeout(1500)});if(!r.ok)throw 0;stat('✓ Tersinkron ke API');if(manual)toast('Sinkron ke API berhasil')}catch(e){stat('● Lokal (IndexedDB)');if(manual)toast('Backend tidak aktif — data tetap aman di IndexedDB')}},manual?0:1500)}
const put=async(s,k,v)=>{await DB[s].setItem(k,v);sync()},del=async(s,k)=>{await DB[s].removeItem(k);sync()};
const snap=()=>({app:'STPN',version:2,progressMateri:P,customQuestions:CQ,tryoutHistory:HIST,studySessions:SESS,notes:NOTES});
function expAll(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snap(),null,2)],{type:'application/json'}));a.download='stpn-backup-'+dk()+'.json';a.click()}
function impAll(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(j.app!=='STPN')throw 0;
  for(const k in j.progressMateri||{}){P[k]=true;await DB.prog.setItem(k,true)}for(const k in j.notes||{}){NOTES[k]=j.notes[k];await DB.notes.setItem(k,j.notes[k])}
  const mg=async(a,arr,s)=>{for(const x of arr||[]){await DB[s].setItem(x.id,x);const i=a.findIndex(z=>z.id==x.id);i<0?a.push(x):a[i]=x}};
  await mg(CQ,j.customQuestions,'q');await mg(HIST,j.tryoutHistory,'to');await mg(SESS,j.studySessions,'ses');HIST.sort((a,b)=>a.date-b.date);sync();toast('Import berhasil');go()}catch(x){toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''}

/* ===== Helpers ===== */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(s){return esc(s).replace(/\$/g,'').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^}]*)\}/g,'√($1)').replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/\\infty/g,'∞').replace(/\\pi/g,'π').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^(-?\w)/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/_(\w)/g,'<sub>$1</sub>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const sg=n=>n<0?''+n:'+'+n,fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[880,1100,1320].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.25;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.25)})}catch(e){}}

/* ===== Soal default otomatis (jawaban dihitung program) ===== */
const fm=(k,p)=>MATERI.find(x=>x.k==k&&x.b.startsWith(p));
function mkQ(k,p,q,c,w,e){const x=fm(k,p),o=shuf([c,...[...new Set(w)].filter(z=>z!==c).slice(0,4)]);return{m:x.m,k,b:x.b,q,o,a:o.indexOf(c),e}}
function mkN(k,p,q,c,e,u='',s){const r=x=>Math.round(x*100)/100;c=r(c);s=s||(Math.abs(c)>=20?Math.round(Math.abs(c)/10):1);
  const w=shuf([c+s,c-s,c+2*s,c-2*s,c+3*s,c-3*s,c*2,c/2].map(r).filter(x=>x!==c&&isFinite(x)&&(c<=0||x>=0)));return mkQ(k,p,q,c+u,w.map(x=>x+u),e)}

/* ===== Timer belajar (state global) ===== */
const tLeft=()=>T.run?Math.max(0,Math.round((T.end-Date.now())/1000)):T.left,tName=()=>T.sel===''?'-':MATERI[T.sel].b;
const tSave=()=>DB.app.setItem('timer',{left:tLeft(),run:T.run,end:T.end,started:T.started,sel:T.sel});
function tSel(v){T.sel=v;tSave();tUI()}
function tStart(){if(T.run)return;if(T.sel===''){const s=$('#tsel');if(s){s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}return toast('Pilih materi yang dipelajari dulu')}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}T.run=true;T.started=true;T.end=Date.now()+T.left*1000;tSave();tUI()}
function tPause(){T.left=tLeft();T.run=false;tSave();tUI()}
function tReset(){T.run=false;T.started=false;T.left=T.dur;tSave();tUI()}
function tStop(){const el=T.dur-tLeft();if(el>=30){logSession(el);toast(`Tersimpan ${Math.round(el/60)} menit belajar`)}tReset();if(view==='dash')go()}
function logSession(sec){const e={id:'s'+Date.now(),date:dk(),sec,materi:tName(),ts:Date.now()};SESS.push(e);put('ses',e.id,e)}
function finishSession(silent){logSession(T.dur);const n=tName();T.run=false;T.started=false;T.left=T.dur;tSave();if(!silent)beep();
  modal(`<div class="text-5xl mb-3">🎉</div><h2 class="text-xl font-bold mb-1">Sesi Selesai!</h2><p class="text-zinc-400 mb-4">60 menit belajar <b>${esc(n)}</b> tersimpan untuk streak harianmu.</p><button class="btn pri" onclick="closeModal()">Lanjut</button>`);if(view==='dash')go();else tUI()}
function ctl(){return(T.run?`<button class="btn pri" onclick="tPause()">⏸ PAUSE</button>`:`<button class="btn pri" onclick="tStart()">▶ ${T.started?'LANJUT':'START'}</button>`)+`<button class="btn" onclick="tReset()">↺ RESET</button>`+(T.started?`<button class="btn" style="color:#f87171" onclick="tStop()">■ SELESAI</button>`:'')}
function tUI(){const l=tLeft(),t=fmtT(l),set=(s,h)=>{const e=$(s);if(e)e.innerHTML=h};
  set('#tdisp',t);const b=$('#tbar');if(b)b.style.width=(T.dur-l)/T.dur*100+'%';
  set('#mini',`⏱ <b>${t}</b> <span class="text-xs text-zinc-500">${T.run?'· belajar':T.started?'· dijeda':'· siap'}</span>`);
  set('#mini2',TO?`📝 Tryout: <b>${fmtT(toLeft())}</b>`:'');set('#totmr',TO?fmtT(toLeft()):'');
  set('#tstat',T.run?`🟢 Sedang Belajar: <b>${esc(tName())}</b>`:T.started?`⏸ Dijeda — ${esc(tName())}`:'Pilih materi, lalu tekan START');
  const s=$('#tsel');if(s)s.disabled=T.started;
  const sig=T.run+'|'+T.started;if(sig!==T.sig){T.sig=sig;set('#tctl',ctl())}}
const toLeft=()=>Math.max(0,Math.round((TO.end-Date.now())/1000));
function tick(){if(T.run&&tLeft()<=0)finishSession();if(TO&&toLeft()<=0)submitTO(true);tUI()}

function updCounts(){[11,12].forEach(k=>{const p=prog(k),e=$('#pc'+k),s=$('#sp'+k);if(e)e.textContent=`${p.d}/${p.n} · ${p.p}%`;if(s)s.textContent=p.p+'%'})}

/* ===== Dashboard ===== */
function streak(){const m={};SESS.forEach(l=>{m[l.date]=(m[l.date]||0)+l.sec});let d=new Date(),n=0;if((m[dk(d)]||0)<60)d.setDate(d.getDate()-1);while((m[dk(d)]||0)>=60){n++;d.setDate(d.getDate()-1)}return[n,Math.round((m[dk()]||0)/60),m]}
function heat(m){const t=new Date();t.setHours(0,0,0,0);const W=26,s=new Date(t);s.setDate(t.getDate()-t.getDay()-(W-1)*7);let h='';
  for(let i=0;i<W*7;i++){const d=new Date(s);d.setDate(s.getDate()+i);if(d>t){h+='<i style="background:transparent"></i>';continue}const mn=(m[dk(d)]||0)/60,c=mn<1?'#1f1f1f':mn<30?'#1e3a8a':mn<60?'#1d4ed8':mn<120?'#3B82F6':'#93c5fd';h+=`<i title="${dk(d)}: ${Math.round(mn)} menit" style="background:${c}"></i>`}
  return`<div class="overflow-x-auto pb-1"><div class="heat">${h}</div></div><div class="flex items-center gap-1 text-[10px] text-zinc-500 mt-2">Sedikit ${['#1f1f1f','#1e3a8a','#1d4ed8','#3B82F6','#93c5fd'].map(c=>`<i class="inline-block w-3 h-3 rounded-sm" style="background:${c}"></i>`).join('')} Banyak</div>`}
function dash(){const[st,today,m]=streak(),last=HIST[HIST.length-1],tot=Object.keys(m).length;
  const pb=k=>{const p=prog(k);return`<div class="card p-5"><div class="flex justify-between items-end mb-3"><b>Kelas ${k}</b><span class="text-3xl font-bold text-blue-400">${p.p}%</span></div><div class="bar"><div style="width:${p.p}%"></div></div><div class="text-xs text-zinc-500 mt-2">${p.d} dari ${p.n} sub-bab selesai</div></div>`};
  const grp=MATERI.map((x,i)=>[x,i]);let opts='<option value="">— Pilih materi yang dipelajari —</option>';
  [11,12].forEach(k=>MAPEL.forEach(mp=>{opts+=`<optgroup label="Kelas ${k} · ${mp}">`+grp.filter(([x])=>x.k==k&&x.m==mp).map(([x,i])=>`<option value="${i}" ${String(T.sel)===String(i)?'selected':''}>${esc(x.b)}</option>`).join('')+'</optgroup>'}));
  return`<div class="flex items-center gap-4 mb-6">${LOGO.replace('width="40" height="40"','width="64" height="64"')}<div><h1 class="text-3xl font-extrabold tracking-widest">STPN</h1><p class="text-zinc-500 text-sm">SMK to PTN · Kelas 11 & 12 Complete 🚀</p></div></div>
  <div class="card p-6 mb-4"><div class="text-xs text-zinc-500 mb-1">STUDY TIMER · 1 JAM</div><div id="tdisp" class="text-6xl md:text-8xl font-extrabold text-blue-400 tracking-tight">60:00</div>
  <div class="bar my-4"><div id="tbar" style="width:0"></div></div><div id="tstat" class="mb-3 text-sm"></div>
  <select id="tsel" class="mb-4 md:w-[28rem]" onchange="tSel(this.value)">${opts}</select><div id="tctl" class="flex flex-wrap gap-2"></div></div>
  <div class="grid md:grid-cols-2 gap-4 mb-4">${pb(11)}${pb(12)}</div>
  <div class="grid md:grid-cols-3 gap-4 mb-4"><div class="card p-5"><div class="text-xs text-zinc-500">🔥 Streak Belajar</div><div class="text-3xl font-bold mt-1">${st} hari</div><div class="text-xs text-zinc-500 mt-1">Hari ini: ${today} menit</div></div>
  <div class="card p-5"><div class="text-xs text-zinc-500">📅 Total Hari Belajar</div><div class="text-3xl font-bold mt-1">${tot}</div><div class="text-xs text-zinc-500 mt-1">${SESS.length} sesi</div></div>
  <div class="card p-5"><div class="text-xs text-zinc-500">🎯 Skor Tryout Terakhir</div><div class="text-3xl font-bold mt-1">${last?last.score:'-'}</div><div class="text-xs text-zinc-500 mt-1">${last?`${last.correct}/${last.n} benar`:'Belum ada tryout'}</div></div></div>
  <div class="card p-5"><div class="text-xs text-zinc-500 mb-3">Aktivitas belajar 26 minggu terakhir</div>${heat(m)}</div>`}

    <label class="k">Jawaban Benar</label>${sel('f-a',L.split(''),L[x.a])}
    <label class="k">Pembahasan</label><textarea id="f-e" rows="3">${esc(x.e)}</textarea>
    <label class="k">Gambar Soal (opsional, disimpan sebagai base64)</label><input type="file" accept="image/*" onchange="readImg(this)"><div id="prev" class="mt-2">${IMG?`<img src="${IMG}" class="max-h-40 rounded"> <button class="btn mt-2" onclick="IMG=null;$('#prev').innerHTML=''">Hapus gambar</button>`:''}</div>
    <div class="mt-5 flex gap-2"><button class="btn pri" onclick="saveQ()">💾 Simpan</button><button class="btn" onclick="bankTab='list';editId=null;IMG=null;go()">Batal</button></div></div>`}
  const list=CQ.filter(x=>(!BF.m||x.m==BF.m)&&(!BF.k||x.k==BF.k)&&(!BF.b||x.b==BF.b)),bs=MATERI.filter(x=>(!BF.m||x.m==BF.m)&&(!BF.k||x.k==BF.k));
  return`<h1 class="text-2xl font-bold mb-4">Bank Soal</h1>${tabs}<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
  <select onchange="setBF('m',this.value)"><option value="">Semua mapel</option>${MAPEL.map(m=>`<option ${m==BF.m?'selected':''}>${m}</option>`).join('')}</select>
  <select onchange="setBF('k',this.value)"><option value="">Semua kelas</option>${[11,12].map(k=>`<option value="${k}" ${k==BF.k?'selected':''}>Kelas ${k}</option>`).join('')}</select>
  <select class="col-span-2" onchange="setBF('b',this.value)"><option value="">Semua bab</option>${bs.map(x=>`<option ${x.b==BF.b?'selected':''}>${esc(x.b)}</option>`).join('')}</select></div>
  <div class="flex flex-wrap gap-2 mb-4 items-center"><button class="btn" onclick="expQ()">⬇ Export Bank Soal</button><label class="btn cursor-pointer">⬆ Import Bank Soal<input type="file" accept=".json" class="hidden" onchange="impQ(event)"></label><span class="text-xs text-zinc-500">${list.length} dari ${CQ.length} soal custom</span></div>
  ${list.length?list.map(x=>`<div class="card p-4 mb-3"><div class="text-xs text-zinc-500 mb-1">${esc(x.m)} · Kelas ${x.k} · ${esc(x.b)}</div><div>${fmt(x.q)}</div>${x.img?`<img src="${x.img}" class="my-2 max-h-60 rounded">`:''}
  <div class="grid md:grid-cols-2 gap-1 mt-2 text-sm">${x.o.map((o,i)=>`<div class="${i==x.a?'text-green-400 font-semibold':''}">${L[i]}. ${fmt(o)}</div>`).join('')}</div>
  <details class="mt-2 text-sm"><summary class="cursor-pointer text-blue-400">Pembahasan</summary><div class="mt-1 text-zinc-400">${fmt(x.e)||'-'}</div></details>
  <div class="mt-3 flex gap-2"><button class="btn" onclick="editQ('${x.id}')">✏️ Edit</button><button class="btn" onclick="delQ('${x.id}')">🗑 Hapus</button></div></div>`).join(''):`<div class="card p-6 text-zinc-500 text-sm">Belum ada soal custom yang cocok. Tambahkan lewat tab "Tambah Soal Baru". Soal default (otomatis) tetap dipakai di Tryout.</div>`}`}
function newQ(){bankTab='add';editId=null;IMG=null;go()}
function editQ(id){editId=id;IMG=CQ.find(x=>x.id==id).img||null;bankTab='add';go()}
function refBab(){$('#f-b').innerHTML=babOpts($('#f-m').value,+$('#f-k').value)}
function readImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL('image/jpeg',.82);$('#prev').innerHTML=`<img src="${IMG}" class="max-h-40 rounded">`};im.src=r.result};r.readAsDataURL(f)}
async function saveQ(){const o=[0,1,2,3,4].map(i=>$('#f-o'+i).value.trim()),q=$('#f-q').value.trim();
  if(!q||o.some(x=>!x))return toast('Soal dan pilihan A–E wajib diisi');
  const x={id:editId||'q'+Date.now(),m:$('#f-m').value,k:+$('#f-k').value,b:$('#f-b').value,q,o,a:L.indexOf($('#f-a').value),e:$('#f-e').value.trim(),img:IMG};
  await put('q',x.id,x);const i=CQ.findIndex(z=>z.id==x.id);i<0?CQ.push(x):CQ[i]=x;bankTab='list';editId=null;IMG=null;toast('Soal tersimpan');go()}
async function delQ(id){if(!confirm('Hapus soal ini?'))return;await del('q',id);CQ=CQ.filter(x=>x.id!=id);go()}
function expQ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CQ,null,2)],{type:'application/json'}));a.download='stpn-bank-soal.json';a.click()}
function impQ(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;let n=0;for(const x of j){if(!x.q||!Array.isArray(x.o)||x.o.length<2||typeof x.a!=='number')continue;x.id=x.id||'q'+Date.now()+n;await put('q',x.id,x);const i=CQ.findIndex(z=>z.id==x.id);i<0?CQ.push(x):CQ[i]=x;n++}toast(`${n} soal diimpor`);go()}catch(err){toast('File JSON tidak valid')}};r.readAsText(f);e.target.value=''}

/* ===== Tryout ===== */
function tryout(){if(TO)return toRun();if(RES)return resView(RES);
  return`<h1 class="text-2xl font-bold mb-1">Tryout UTBK</h1><p class="text-zinc-500 text-sm mb-5">Soal diacak dari Bank Soal custom (${CQ.length}) + soal default otomatis.</p>
  <div class="card p-5 max-w-md mb-6"><label class="k" style="margin-top:0">Jumlah soal</label><select id="tn"><option value="50">50 soal · 90 menit</option><option value="75">75 soal · 135 menit</option><option value="100">100 soal · 180 menit</option></select>
  <label class="k">Sumber soal</label><select id="ts"><option value="all">Semua Soal</option><option value="mat">Hanya Matematika</option><option value="k12">Hanya Kelas 12</option><option value="custom">Hanya Soal Custom</option></select><button class="btn pri mt-4" onclick="startTO()">Mulai Tryout</button></div>
  <h3 class="font-semibold mb-2">Riwayat Tryout</h3>${HIST.length?[...HIST].reverse().map(h=>`<div class="card p-3 mb-2 flex justify-between items-center text-sm"><span>${new Date(h.date).toLocaleString('id-ID')} · ${h.n} soal</span><span>${h.correct} benar · <b class="text-blue-400">${h.score}</b> <button class="btn ml-2" onclick="showRes('${h.id}')">Lihat</button></span></div>`).join(''):'<div class="text-zinc-500 text-sm">Belum ada riwayat.</div>'}`}
function startTO(){let n=+$('#tn').value,src=$('#ts').value,dur={50:90,75:135,100:180}[n];
  if(src=='custom'){if(!CQ.length)return toast('Belum ada soal custom');if(CQ.length<n){n=CQ.length;dur=Math.max(1,Math.round(n*1.8));toast(`Soal custom hanya ${n}, tryout disesuaikan`)}}
  const ok=src=='mat'?x=>x.m.startsWith('Matematika'):src=='k12'?x=>x.k==12:()=>true;let qs=shuf(CQ.filter(ok)).slice(0,n);
  if(src!='custom'){const seen=new Set(qs.map(x=>x.q));let t=0;while(qs.length<n&&t++<20000){const x=genQ();if(ok(x)&&!seen.has(x.q)){seen.add(x.q);qs.push(x)}}while(qs.length<n){let x;do{x=genQ()}while(!ok(x));qs.push(x)}}
  TO={qs:shuf(qs),ans:Array(n).fill(null),flag:Array(n).fill(false),cur:0,n,dur,end:Date.now()+dur*60000};RES=null;go('to')}
function toRun(){const i=TO.cur,q=TO.qs[i];
  return`<div class="flex flex-col lg:flex-row gap-4"><div class="flex-1 card p-5"><div class="flex justify-between text-xs text-zinc-500 mb-3"><span>Soal ${i+1}/${TO.n} · ${esc(q.m)} · ${esc(q.b)}</span>${TO.flag[i]?'<span class="text-yellow-400">● Ragu-ragu</span>':''}</div>
  <div class="leading-relaxed">${fmt(q.q)}</div>${q.img?`<img src="${q.img}" class="my-3 max-h-64 rounded">`:''}
  ${q.o.map((o,j)=>`<button class="opt ${TO.ans[i]===j?'sel':''}" onclick="TO.ans[TO.cur]=${j};go()"><b>${L[j]}.</b> ${fmt(o)}</button>`).join('')}
  <div class="flex flex-wrap gap-2 mt-5"><button class="btn" ${i?'':'disabled'} onclick="navQ(${i-1})">← Sebelumnya</button><button class="btn" onclick="TO.flag[TO.cur]=!TO.flag[TO.cur];go()">🚩 Tandai Ragu-ragu</button><button class="btn" onclick="TO.ans[TO.cur]=null;go()">Kosongkan</button><button class="btn pri" ${i<TO.n-1?'':'disabled'} onclick="navQ(${i+1})">Berikutnya →</button></div></div>
  <div class="lg:w-72 card p-4 h-fit"><div class="text-xs text-zinc-500">Sisa waktu</div><div id="totmr" class="text-3xl font-bold text-blue-400 mb-3"></div>
  <div class="grid grid-cols-5 gap-1.5">${TO.ans.map((a,j)=>`<button class="nb ${TO.flag[j]?'f':a!==null?'a':''} ${j==i?'cur':''}" onclick="navQ(${j})">${j+1}</button>`).join('')}</div>
  <div class="text-[11px] text-zinc-500 mt-3">Abu = belum · <span class="text-blue-400">Biru</span> = dijawab · <span class="text-yellow-400">Kuning</span> = ragu-ragu</div><button class="btn pri w-full mt-4" onclick="submitTO()">Selesai</button></div></div>`}
function navQ(i){if(i>=0&&i<TO.n){TO.cur=i;go()}}
async function submitTO(auto){const empty=TO.ans.filter(a=>a===null).length;if(!auto&&!confirm(empty?`Masih ${empty} soal kosong. Selesaikan tryout?`:'Selesaikan tryout?'))return;
  const c=TO.qs.filter((q,i)=>TO.ans[i]===q.a).length,r={id:'t'+Date.now(),date:Date.now(),n:TO.n,correct:c,wrong:TO.n-c-empty,empty,score:Math.round(c/TO.n*1000)/10,dur:TO.dur,qs:TO.qs,ans:TO.ans};
  HIST.push(r);TO=null;RES=r;await put('to',r.id,r);if(auto)beep();go('to')}
function showRes(id){RES=HIST.find(h=>h.id==id);go('to')}
function resView(r){return`<div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Hasil Tryout</h1><button class="btn" onclick="RES=null;go()">← Kembali</button></div>
  <div class="card p-6 mb-5"><div class="text-xs text-zinc-500">NILAI</div><div class="text-6xl font-extrabold text-blue-400">${r.score}</div><div class="text-sm mt-2 text-zinc-400"><span class="text-green-400">${r.correct} benar</span> · <span class="text-red-400">${r.wrong} salah</span> · ${r.empty} kosong · dari ${r.n} soal</div></div>
  ${r.qs.map((q,i)=>{const a=r.ans[i],ok=a===q.a;return`<div class="card p-4 mb-3"><div class="text-xs mb-1 ${ok?'text-green-400':a===null?'text-zinc-500':'text-red-400'}">${i+1}. ${esc(q.m)} · ${esc(q.b)} · ${ok?'Benar':a===null?'Kosong':'Salah'}</div><div>${fmt(q.q)}</div>${q.img?`<img src="${q.img}" class="my-2 max-h-52 rounded">`:''}
  ${q.o.map((o,j)=>`<div class="opt ${j==q.a?'ok':j===a?'bad':''}"><b>${L[j]}.</b> ${fmt(o)}</div>`).join('')}<div class="mt-3 text-sm bg-black/40 p-3 rounded-lg"><b class="text-blue-400">Pembahasan:</b> ${fmt(q.e)||'-'}</div></div>`}).join('')}`}

/* ===== Init ===== */
(async()=>{
  try{
    await Promise.all([DB.prog.iterate((v,k)=>{P[k]=v}),DB.q.iterate(v=>{CQ.push(v)}),DB.to.iterate(v=>{HIST.push(v)}),DB.ses.iterate(v=>{SESS.push(v)}),DB.notes.iterate((v,k)=>{NOTES[k]=v})]);
    HIST.sort((a,b)=>a.date-b.date);
    const s=await DB.app.getItem('timer');if(s)Object.assign(T,{left:s.left,run:s.run,end:s.end,started:s.started,sel:s.sel===undefined?'':s.sel});
  }catch(e){toast('IndexedDB tidak tersedia — data tidak akan persisten')}
  go('dash');if(T.run&&tLeft()<=0)finishSession(true);setInterval(tick,250);sync();
})();
</script>
</body>
</html>
